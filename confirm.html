<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Booking confirmation</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#07080a; --panel:#121319; --line:rgba(255,255,255,.08);
    --ink:#f5f6f8; --muted:#9aa1ab; --faint:#6b7280;
    --sky:#7cc4fa; --on-sky:#06283d; --green:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 56px),
      repeating-linear-gradient(25deg,rgba(255,255,255,.02) 0 1px,transparent 1px 56px);
    background-attachment:fixed}
  .wrap{max-width:440px;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 34px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
  .word{font-size:24px;font-weight:800;font-style:italic;letter-spacing:-.5px;text-align:center;margin-bottom:26px}
  .greet{font-size:26px;font-weight:700;font-style:italic;letter-spacing:-.5px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
  .svc{font-size:19px;font-weight:800}
  .when{color:var(--muted);font-style:italic;font-size:14px;margin-top:4px}
  .price{font-size:36px;font-weight:800;font-style:italic;letter-spacing:-.5px;margin-top:14px}
  .tc-row{display:flex;align-items:flex-start;gap:11px;margin-top:22px}
  .tc-row input{width:19px;height:19px;margin-top:1px;accent-color:var(--sky);flex-shrink:0}
  .tc-main{font-size:14px;font-weight:600}
  .tc-hint{color:var(--faint);font-size:12px;margin-top:2px}
  .tc-hint a{color:var(--sky);text-decoration:none;cursor:pointer}
  .terms-body{display:none;margin-top:12px;background:#0d0e12;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .terms-body.open{display:block}
  .terms-label{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .terms-text{margin-top:8px;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .fee-line{margin-top:10px;font-weight:700;font-size:13px}
  .cta:disabled{opacity:.45;cursor:default}
  .cta{width:100%;margin-top:24px;border:0;border-radius:999px;background:var(--sky);color:var(--on-sky);
    font-weight:800;font-size:16px;padding:16px;cursor:pointer;text-align:center}
  .cta:active{filter:brightness(.95)}
  .confirmed{margin-top:24px;text-align:center}
  .confirmed .ck{width:52px;height:52px;border-radius:50%;background:rgba(52,211,153,.14);color:var(--green);
    display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
  .confirmed .headline{font-weight:800;font-size:17px;color:var(--green)}
  .confirmed .note{margin-top:6px;color:var(--muted);font-size:13px}
  .call{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none}
  .call a{color:var(--sky)}
  .err-word{font-size:20px;font-weight:800;font-style:italic;text-align:center;margin-bottom:22px;color:var(--muted)}
  .err-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;
    color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fromBase64Url(str){
  str=String(str||"").replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  return decodeURIComponent(escape(atob(str)));
}
function fmtPhoneDigits(d){
  d=String(d||"").replace(/[^\d]/g,"");
  if(d.length===10)return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
  if(d.length===11&&d[0]==="1")return "("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7);
  return d;
}
function fmtTime12(t){
  if(!t)return "";
  var parts=t.split(":"),h=+parts[0],m=+parts[1]||0;
  if(!isFinite(h))return "";
  var ap=h>=12?"PM":"AM",hh=((h+11)%12)+1;
  return hh+":"+String(m).padStart(2,"0")+" "+ap;
}
function fmtLongDate(dt){
  var d=new Date(dt+"T12:00:00");
  if(isNaN(d.getTime()))return "";
  return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
function fmtMoney(p){
  var n=+p;if(!isFinite(n))n=0;
  return "$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function renderError(){
  document.getElementById("app").innerHTML=
    '<div class="err-word">Booking confirmation</div>'+
    '<div class="err-card">This link is incomplete.<br>Please ask for a new link, or call to confirm your appointment.</div>';
}
function parseData(){
  var qs=new URLSearchParams(location.search);
  var raw=qs.get("d");
  if(!raw)return null;
  var d;
  try{ d=JSON.parse(fromBase64Url(raw)); }catch(e){ return null; }
  if(!d||typeof d!=="object")return null;
  if(!d.b||!d.ph||!d.n||!d.s||!d.dt||typeof d.p==="undefined")return null;
  if(!isFinite(+d.p))return null;
  return {
    b:String(d.b),ph:String(d.ph).replace(/[^\d+]/g,""),n:String(d.n),s:String(d.s),
    dt:String(d.dt),t:d.t?String(d.t):"",p:+d.p,f:isFinite(+d.f)?+d.f:0,
    x:typeof d.x==="string"?d.x:""
  };
}
function render(){
  var d=parseData();
  if(!d){renderError();return;}
  var longDate=fmtLongDate(d.dt);
  var timeStr=fmtTime12(d.t);
  var termsText=(d.x||"").replace(/\{fee\}/g,d.f);
  var phoneFmt=fmtPhoneDigits(d.ph);
  var app=document.getElementById("app");
  app.innerHTML=
    '<div class="word">'+esc(d.b)+'</div>'+
    '<div class="greet">Hi '+esc(d.n)+',</div>'+
    '<div class="card">'+
      '<div class="svc">'+esc(d.s)+'</div>'+
      '<div class="when">'+esc(longDate)+(timeStr?' &middot; '+esc(timeStr):'')+'</div>'+
      '<div class="price">'+esc(fmtMoney(d.p))+'</div>'+
      '<div class="tc-row"><input type="checkbox" id="tc-check" aria-label="Accept terms">'+
        '<div><div class="tc-main">I accept the terms and conditions</div>'+
        '<div class="tc-hint"><a id="tc-review">Tap to review</a></div></div></div>'+
      '<div class="terms-body" id="terms-body">'+
        '<div class="terms-label">Terms &amp; conditions</div>'+
        '<div class="terms-text">'+esc(termsText)+'</div>'+
        '<div class="fee-line">Cancellations within 24 hours of the visit carry a '+esc(d.f)+'% fee.</div>'+
      '</div>'+
    '</div>'+
    '<div id="cta-area">'+
      '<button class="cta" id="agree-btn" disabled>Agree &amp; Confirm</button>'+
    '</div>'+
    (d.ph?'<div class="call">Prefer to call? <a href="tel:+'+esc(d.ph)+'">'+esc(phoneFmt)+'</a></div>':'');
  var check=document.getElementById("tc-check");
  var review=document.getElementById("tc-review");
  var btn=document.getElementById("agree-btn");
  if(check)check.onchange=function(){btn.disabled=!check.checked;};
  if(review)review.onclick=function(e){e.preventDefault();
    var tb=document.getElementById("terms-body");
    tb.classList.toggle("open");
    review.textContent=tb.classList.contains("open")?"Hide":"Tap to review";
  };
  if(btn)btn.onclick=function(){
    if(check&&!check.checked)return;
    document.getElementById("cta-area").innerHTML=
      '<div class="confirmed">'+
        '<div class="ck">&#10003;</div>'+
        '<div class="headline">Confirmed &mdash; thank you!</div>'+
        '<div class="note">A confirmation text is opening &mdash; please press send, it&#39;s your receipt.</div>'+
      '</div>';
    var msg="CONFIRMED ✓ — "+d.n+", "+d.s+" on "+longDate+(timeStr?", "+timeStr:"")+
      ". I agree to the terms including the "+d.f+"% cancellation fee.";
    if(d.ph)location.href="sms:+"+d.ph+"?&body="+encodeURIComponent(msg);
  };
}
render();
</script>
</body>
</html>
