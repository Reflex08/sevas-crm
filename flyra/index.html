/* ---------------- Reports (screen 10) ----------------
   One rule for every number on this screen: money that actually landed — collected on a
   DONE job, this calendar year. The chart is the only trailing-12-month view. */
const curYear=()=>new Date().getFullYear();
const doneThisYear=()=>db.jobs.filter(j=>j.status==="done"&&(j.date||"").slice(0,4)===String(curYear()));
/* Reports display grouping: the big four stay themselves, walkway work reads as
   interlocking/pressure washing, and every one-off service folds into "& Other". */
function svcGroup(s){
  s=String(s||"");
  if(/concrete|walkway|interlock|pressure/i.test(s))return "Interlocking / Pressure Washing";
  if(/window/i.test(s))return "Window Cleaning";
  if(/gutter/i.test(s))return "Gutter Cleaning";
  if(/snow/i.test(s))return "Snow Clearing";
  return "& Other";
}
function groupTotals(keyFn){
  const m=new Map();
  doneThisYear().forEach(j=>{const k=keyFn(j);m.set(k,(m.get(k)||0)+(+j.collected||0));});
  return [...m].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}
function barRow(label,amount,max){

/* The leak finder. Each row is money the business already earned but has not banked —
   or a promise the calendar has quietly dropped. */
function leakRows(){
  const now=Date.now(),cut=now-7*86400000;
  const touched=c=>(c.log&&c.log.length?+c.log[c.log.length-1].t:0)||+c.createdAt||0;
  const stale=db.customers.filter(c=>c.stage==="quoted"&&touched(c)<cut);
  const lost=db.customers.filter(c=>c.stage==="lost"&&new Date(touched(c)).getFullYear()===curYear());
  const unsched=db.plans.filter(p=>p.status==="active"&&!db.jobs.some(j=>j.planId===p.id&&j.status==="scheduled"));
  return [
    {id:"stale",label:"Stale quotes",hint:"quoted, untouched for over 7 days",view:"leads",
     count:stale.length,amount:stale.reduce((s,c)=>s+custValue(c.id),0)},
    {id:"lost",label:"Lost this year",hint:"estimated value that walked away",view:"",
     count:lost.length,amount:lost.reduce((s,c)=>s+custValue(c.id),0)},
    {id:"unsched",label:"Unscheduled active plans",hint:"every active plan should have its next visit booked",
     view:"plans",count:unsched.length,amount:unsched.reduce((s,p)=>s+(+p.perVisit||0),0)},
  ];
}

/* ---- Importer: Seva's CRM (servicepro.v2) → Flyra ----
   Incoming ids are never trusted; every row is re-keyed through our own seqs. A customer whose
   phone digits already exist merges into that row (jobs appended) instead of doubling up.
   Cancelled jobs are dropped, closers become sales users, and nothing is invented: no invoices,
   no plans, no pins. Built into a clone so a bad row can never leave a half-imported db. */
const SP_STAGE={lead:"quoted",active:"won",inactive:"lost"};
const phoneKey=p=>String(p||"").replace(/\D/g,"");
function importServicePro(json){
  const src=typeof json==="string"?JSON.parse(json):json;
  if(!src||typeof src!=="object")throw new Error("not a CRM export");
  const next=JSON.parse(JSON.stringify(db)),out={customers:0,jobs:0,users:0};
  const byPhone={};next.customers.forEach(c=>{const k=phoneKey(c.phone);if(k)byPhone[k]=c;});
  const findUser=n=>next.users.find(u=>String(u.name||"").toLowerCase()===n.toLowerCase());
  const idMap={};
  (Array.isArray(src.customers)?src.customers:[]).forEach(oc=>{
    if(!oc||typeof oc!=="object")return;
    const key=phoneKey(oc.phone);
    const log=(Array.isArray(oc.log)?oc.log:[]).filter(e=>e&&e.m).map(e=>({t:+e.t||Date.now(),m:String(e.m)}));
    const tags=(Array.isArray(oc.tags)?oc.tags:[]).map(String);
    const hit=key?byPhone[key]:null;
    if(hit){ // same phone = same person: keep their row, fold the history in
      hit.log=(hit.log||[]).concat(log);
      if(!hit.notes&&oc.notes)hit.notes=String(oc.notes);
      tags.forEach(t=>{if(t&&!hit.tags.includes(t))hit.tags.push(t);});
      idMap[oc.id]=hit.id;return;
    }
    const c={id:next.seqC++,name:String(oc.name||"").trim()||"Unnamed",phone:String(oc.phone||""),
      email:String(oc.email||""),street:String(oc.street||""),city:String(oc.city||""),lat:null,lng:null,
      stage:SP_STAGE[oc.status]||"new",source:"Seva CRM",tags,notes:String(oc.notes||""),log,
      createdAt:Date.now(),ownerId:1,followup:String(oc.followup||"")};
    next.customers.push(c);if(key)byPhone[key]=c;idMap[oc.id]=c.id;out.customers++;
  });
  const closers={}; // customer → whoever closed their most recent job, becomes ownerId
  (Array.isArray(src.jobs)?src.jobs:[]).forEach(oj=>{
    if(!oj||typeof oj!=="object"||oj.status==="cancelled")return;
    const cid=idMap[oj.customerId];if(cid==null)return;
    const cb=String(oj.closedBy||"").trim();
    let closerId=null;
    if(cb){
      let u=findUser(cb);
      if(!u){u={id:next.seqU++,name:cb,role:"sales",color:avatarColor(cb),active:true,
        commissionPct:Math.max(0,Math.min(100,+oj.commissionPct||0))};next.users.push(u);out.users++;}
      closerId=u.id;
    }
    const done=oj.status==="completed";
    const date=/^\d{4}-\d{2}-\d{2}$/.test(oj.date||"")?oj.date:today();
    // Per-job commission truth (F12): this job's own closedBy+commissionPct, not a blanket
    // customer-owner guess — that guess is what inflated payroll ~8x in the old importer.
    const jobPct=closerId?Math.max(0,Math.min(100,+oj.commissionPct||0)):0;
    next.jobs.push({id:next.seqJ++,customerId:cid,service:String(oj.service||"Service"),price:+oj.price||0,
      date,time:String(oj.time||""),durMin:60,crewIds:closerId?[closerId]:[],status:done?"done":"scheduled",
      collected:+oj.collected||0,payMethod:String(oj.payMethod||""),notes:String(oj.notes||""),
      signature:"",signedAt:0,invoiceId:null,planId:null,closerId,commissionPct:jobPct,termsAcceptedAt:0,
      completedAt:done?new Date(date+"T12:00:00").getTime():0,createdAt:Date.now()});
    out.jobs++;
    if(closerId&&(!closers[cid]||date>=closers[cid].date))closers[cid]={date,userId:closerId};
  });
  Object.keys(closers).forEach(k=>{const c=next.customers.find(x=>x.id===+k);
    if(c)c.ownerId=closers[k].userId;});
  db=normalize(next);save();
  return out;
}
function wipeToOwner(){ // clean slate for a real import: keep settings + the owner, drop everything else (demo included)
  db.users=db.users.filter(u=>u.role==="owner");
  ["customers","jobs","invoices","plans","pins","messages","equipment","expenses","payouts"]
    .forEach(k=>db[k]=[]);
  db=normalize(db);save();
}

}
function readPicked(input,fn){

  const fr=new FileReader();
  fr.onload=()=>fn(String(fr.result||""));
  fr.onerror=()=>toast("Could not read that file","err");
  fr.readAsText(file);
}

/* ---------------- Cloud sync (private GitHub gist — ported from Desktop\CRM.html, owner's code) ----
   Whole-file last-write-wins on db.updatedAt: newest copy wins, no merge. The token lives in
   localStorage ONLY — never in db, never in a backup, never in the gist. This is the one place in
   the app that touches api.github.com, and only once a token is stored. */
const SYNC_KEY="flyra.synckey",SYNC_GIST="flyra.syncgist",SYNC_LAST="flyra.synclast",GIST_FILE="flyra-db.json";
let syncState="off",syncBusy=false,syncTimer=null,syncArmed=false,syncArms=0; // off|ok|err
function syncToken(){try{return localStorage.getItem(SYNC_KEY)||"";}catch(e){return"";}}
function relTime(ts){if(!ts)return"never";const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);
  if(h<24)return h+"h ago";return Math.round(h/24)+"d ago";}
async function gh(method,url,body){
  const res=await fetch("https://api.github.com"+url,{method,
    headers:{"Authorization":"Bearer "+syncToken(),"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error("GitHub "+res.status+(res.status===401?" — check the token":""));
  return res.json();
}
/* Our gist is the one holding flyra-db.json — the old CRM's servicepro gist is never matched. */
async function syncFindGist(){
  let id=localStorage.getItem(SYNC_GIST);
  if(id)return id;
  const list=await gh("GET","/gists?per_page=100");
  const hit=(Array.isArray(list)?list:[]).find(g=>g.files&&g.files[GIST_FILE]);
  if(hit){localStorage.setItem(SYNC_GIST,hit.id);return hit.id;}
  return null;
}
async function syncFetchRemote(id){
  const g=await gh("GET","/gists/"+id);
  const f=g.files&&g.files[GIST_FILE];if(!f)return null;
  let text=f.content;
  if(f.truncated){const r=await fetch(f.raw_url);text=await r.text();}
  const remote=JSON.parse(text);
  return (remote&&Array.isArray(remote.customers))?remote:null;
}
/* Cloud wins: take it whole and write straight to storage — save() would push it right back. */
function adoptCloud(remote){
  db=normalize(remote);
  localStorage.setItem(DBKEY,JSON.stringify(db));
  render();
}
async function syncPull(){
  if(!syncToken())return false;
  try{
    const id=await syncFindGist();
    if(!id){syncState="ok";paintSyncChip();return false;}
    const remote=await syncFetchRemote(id);
    syncState="ok";
    if(remote&&(remote.updatedAt||0)>(db.updatedAt||0)){adoptCloud(remote);toast("Synced from your other device","ok");}
    paintSyncChip();return true;
  }catch(e){syncState="err";paintSyncChip();return false;}
}
async function syncPush(){
  if(!syncToken()||syncBusy)return;
  syncBusy=true;
  try{
    const id=await syncFindGist();
    const payload={description:"Flyra — synced data (auto-managed, don't edit)",public:false,
      files:{[GIST_FILE]:{content:JSON.stringify(db)}}};
    if(id)await gh("PATCH","/gists/"+id,payload);
    else{const g=await gh("POST","/gists",payload);localStorage.setItem(SYNC_GIST,g.id);}
    syncState="ok";localStorage.setItem(SYNC_LAST,String(Date.now()));
  }catch(e){syncState="err";}
  syncBusy=false;paintSyncChip();
}
/* Debounce: the first save of a burst arms one push, later saves ride along (syncPush reads db
   when it fires, so it always uploads the latest). A reset-the-timer debounce would never fire
   while someone types. */
function scheduleSync(){
  if(!syncToken()||syncArmed)return;
  syncArmed=true;syncArms++;
  syncTimer=setTimeout(()=>{syncArmed=false;syncPush();},2000);
}
function paintSyncChip(){
  const el=$("#sync-chip");if(!el)return;const t=$("#sync-text");
  el.className="sync-chip"+(syncState==="ok"?" on":"");
  const led=el.querySelector(".led");if(led)led.style.background=syncState==="err"?"var(--amber)":"";
  if(!syncToken())t.textContent="Cloud sync: off";
  else if(syncState==="err")t.textContent="⚠ Sync error — tap to retry";
  else{const ts=+localStorage.getItem(SYNC_LAST)||0;t.textContent="Cloud sync: on · "+(ts?relTime(ts):"just set up");}
  paintSyncCard();
}
function paintSyncCard(){
  const st=$("#sync-state");if(!st)return;
  st.textContent=!syncToken()?"off — paste a token below (do this on every device)":
    syncState==="err"?"error — check the token, then tap the chip in the menu":
    "on — this device pushes every change and pulls when it opens";
}
/* Pairing decides pull-vs-push out loud, so a fresh phone never silently clobbers the cloud. */
async function syncConnect(token){
  localStorage.setItem(SYNC_KEY,token);
  try{
    const id=await syncFindGist();
    if(id){
      const remote=await syncFetchRemote(id);
      if(remote&&confirm("Cloud copy found: "+remote.customers.length+" clients, "+(remote.jobs||[]).length+" jobs.\n\n"+
        "Load the cloud copy onto this device? OK = replace this device's data with the cloud. Cancel = overwrite the cloud with THIS device.")){
        adoptCloud(remote);toast("Cloud data loaded onto this device","ok");
      }else{await syncPush();toast("Cloud updated from this device","ok");}
    }else{await syncPush();toast("Sync on — this device seeded the cloud","ok");}
    syncState="ok";
  }catch(e){syncState="err";toast("Sync setup failed — "+((e&&e.message)||"check the token"),"err");}
  paintSyncChip();if(view==="settings")renderSettings();
}
function syncDisconnect(){ // key goes, data stays
  localStorage.removeItem(SYNC_KEY);localStorage.removeItem(SYNC_GIST);localStorage.removeItem(SYNC_LAST);
  syncState="off";paintSyncChip();toast("Cloud sync off — your data stays on this device","ok");
  if(view==="settings")renderSettings();
}
/* Manual sync always says what happened — silence reads as "broken". */
async function syncNow(){
  if(!syncToken()){setView("settings");drawer(false);toast("Paste a GitHub token to turn sync on");return;}
  toast("Syncing…");
  await syncPull();await syncPush();
  toast(syncState==="err"?"⚠ Sync failed — check the token":
    "Sync complete · "+db.customers.length+" clients, "+db.jobs.length+" jobs",syncState==="err"?"err":"ok");
}
function syncCard(){
  return '<div class="panel"><h2>Cloud sync</h2><div class="panel-pad">'+
    '<div class="note" style="margin-bottom:12px"><b>Status:</b> <span id="sync-state">…</span><br>'+
      'Every change uploads to a <b>private</b> GitHub gist ('+esc(GIST_FILE)+') on your account, and each '+
      'device pulls the newest copy when it opens. Newest wins, whole file.</div>'+
    '<div class="field"><label>GitHub token</label>'+
      '<input id="sync-key" type="password" autocomplete="off" placeholder="ghp_…"></div>'+
    '<div class="toolbar"><button class="btn sm btn-primary" id="sync-connect">Connect</button>'+
      (syncToken()?'<button class="btn sm btn-ghost" id="sync-off">Disconnect</button>':'')+'</div>'+
    '<div class="hint">Classic GitHub token, <b>gist</b> scope only — make one at '+
      'github.com/settings/tokens/new?scopes=gist. The token stays in this browser: never in the '+
      'database, never in a backup file.</div>'+
    '</div></div>';
}
function bindSyncCard(){
  paintSyncCard();
  const c=$("#sync-connect");if(c)c.onclick=()=>{
    const v=(($("#sync-key")||{}).value||"").trim();
    if(!v){toast("Paste your GitHub token first","err");return;}
    toast("Connecting…");syncConnect(v);};
  const off=$("#sync-off");if(off)off.onclick=syncDisconnect;
}

/* ---------------- Modal plumbing ---------------- */
const MODALS=["job-overlay","cust-overlay","invoice-overlay","plan-overlay","sign-overlay"];
function openModal(id){const o=$("#"+id);if(o)o.classList.add("show");}
function closeModal(id){const o=$("#"+id);if(o)o.classList.remove("show");}
function closeAllModals(){MODALS.forEach(closeModal);}
// A tap closes a modal only if it STARTED on the backdrop — a scroll drag that ends past the
// modal's edge otherwise lands on the overlay and dismisses it mid-scroll on phones.
let __pdBackdrop=null;
document.addEventListener("pointerdown",e=>{
  __pdBackdrop=(e.target&&e.target.classList&&e.target.classList.contains("overlay"))?e.target:null;},true);
MODALS.forEach(id=>{const o=$("#"+id);if(!o)return;
  o.addEventListener("click",e=>{if(e.target===o&&__pdBackdrop===o)closeModal(id);});});
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));

/* ---------------- Drawer / global wiring ---------------- */
function drawer(open){$("#drawer").classList.toggle("open",open);$("#drawer-veil").classList.toggle("show",open);}
document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>{setView(a.dataset.view);drawer(false);});
$("#menu-btn").onclick=()=>drawer(!$("#drawer").classList.contains("open"));
$("#drawer-veil").onclick=()=>drawer(false);
$("#fab-add").onclick=()=>openJob(null);
$("#sync-chip").onclick=syncNow;
$("#who-btn").onclick=switchUser;
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if($("#drawer").classList.contains("open")){drawer(false);return;} // drawer first
  closeAllModals();
});

ensurePlanJobs(); // every active plan always has its next visit booked
// The rules run on the first open of each day (they think in whole days, so more often is noise —
// the Messages screen has a button to force a run). They only ever QUEUE drafts.
let bootQueued=0;
if(db.settings.automation.lastRun!==today()){bootQueued=runAutomations();stampAutoRun();}
applyWhoDefaults(); // rep phones open on their own crew filter, and never on an office screen
render();
if(bootQueued)toast(bootQueued+" draft"+(bootQueued===1?"":"s")+" queued — tap to send","ok");
// Sync is the only thing that reaches the network on open, and only when this device has a token.
paintSyncChip();
if(syncToken())syncPull();
</script>
