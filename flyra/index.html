<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flyra">
<meta name="theme-color" content="#07080a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Flyra</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2307080a"/><text x="32" y="46" font-family="Georgia,serif" font-size="40" font-weight="bold" font-style="italic" text-anchor="middle" fill="%2356b8f5">F</text></svg>'>
<style>
  :root{
    color-scheme:dark;
    /* near-black ground, hairline-bordered dark cards, cyan-blue accent, purple chart */
    --bg0:#07080a; --bg1:#07080a;
    --panel:#121319; --panel2:#0d0e12;
    --ink:#f5f6f8; --muted:#9aa1ab; --faint:#6b7280; --line:rgba(255,255,255,.08);
    --brand:#56b8f5; --brand-d:#2f8fd6; --brand-soft:rgba(86,184,245,.14);
    --sky:#7cc4fa; --on-sky:#06283d;
    --green:#34d399; --green-soft:rgba(52,211,153,.12); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.12);
    --red:#f98080; --red-soft:rgba(248,113,113,.12); --purple:#a78bfa; --purple-soft:rgba(139,92,246,.14);
    --chart:#8b5cf6;
    --cyan:#5ac8fa; --cyan-soft:rgba(90,200,250,.12);
    --gold:#f5a623; --gold-soft:rgba(245,166,35,.14);
    --gray-soft:rgba(255,255,255,.07);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.6);
    --field-bg:rgba(255,255,255,.04); --hover:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg0);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 56px),repeating-linear-gradient(25deg,rgba(255,255,255,.02) 0 1px,transparent 1px 56px);
    background-attachment:fixed}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  /* The native dropdown popup ignores page CSS unless the select itself opts into the dark UA
     theme AND the options carry explicit colors — otherwise Chrome paints a white list. */
  select{color-scheme:dark}
  select option,select optgroup{background-color:#121319;color:#f5f6f8}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .mono{font-variant-numeric:tabular-nums}
  .spacer{flex:1}

  /* ---------- Layout ---------- */
  .content{padding:calc(var(--safetop,env(safe-area-inset-top,0px)) + 66px) 18px 110px;max-width:1080px;margin:0 auto}
  .page-head{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
  .ph-title{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .ph-sub{color:var(--faint);font-style:italic;font-size:13px;margin-top:2px}

  /* ---------- Floating chrome (hamburger, drawer, FAB) ---------- */
  .fcir{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(13,14,18,.85);
    backdrop-filter:blur(8px);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);flex-shrink:0}
  .fpill{position:relative;height:42px;border-radius:999px;border:1px solid var(--line);background:rgba(13,14,18,.85);backdrop-filter:blur(8px);
    color:var(--ink);font-weight:700;font-size:13px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  .fpill select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  #menu-btn{position:fixed;top:calc(var(--safetop,env(safe-area-inset-top,0px)) + 12px);left:14px;z-index:45}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:#0d0e12;border-right:1px solid var(--line);
    z-index:60;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;
    padding:calc(var(--safetop,env(safe-area-inset-top,0px)) + 10px) 0 14px}
  .drawer.open{transform:none}
  .drawer-veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
  .drawer-veil.show{display:block}
  .brand{padding:22px 20px 18px;font-size:26px;font-weight:800;font-style:italic;letter-spacing:-.5px;line-height:1.1;color:var(--ink)}
  .brand em{color:var(--brand);font-style:italic}
  .brand small{display:block;font-style:normal;font-size:9px;font-weight:700;color:var(--faint);
    letter-spacing:.26em;margin-top:7px;text-transform:uppercase}
  .nav{padding:8px 12px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--muted);
    font-weight:600;margin-bottom:2px;cursor:pointer;font-size:14px}
  .nav a:hover{background:var(--hover);color:var(--ink);text-decoration:none}
  .nav a.active{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
  .nav a .ic{width:18px;text-align:center;font-size:15px}
  .nav a .count{margin-left:auto;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
  .nav a.active .count{background:rgba(0,0,0,.35)}
  .sync-chip{margin:0 12px 8px;padding:9px 12px;border-radius:9px;background:var(--panel);font-size:12px;
    color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line)}
  .sync-chip .led{width:9px;height:9px;border-radius:50%;background:#6b7385;flex-shrink:0}
  .sync-chip.on .led{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
  .drawer-foot{padding:10px 20px 2px;color:var(--faint);font-size:11px;font-style:italic}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
    border:0;background:var(--sky);color:var(--on-sky);font-size:26px;display:inline-flex;align-items:center;justify-content:center;
    z-index:44;box-shadow:var(--shadow-lg)}
  .no-fab .fab{display:none}

  /* ---------- Device identity (R2) ---------- */
  .who-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:0 12px 8px;padding:9px 12px;
    border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-weight:700;font-size:12px;cursor:pointer;text-align:left}
  .who-btn:hover{background:var(--hover);color:var(--ink)}
  body.picking #menu-btn,body.picking .fab,body.picking .drawer,body.picking .drawer-veil{display:none}
  .who-wrap{max-width:560px;margin:0 auto;padding:26px 0}
  .who-q{font-size:27px;font-weight:700;font-style:italic;letter-spacing:-.5px;line-height:1.15}
  .who-sub{color:var(--faint);font-style:italic;font-size:13.5px;margin:4px 0 22px}
  .who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .who-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 12px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;
    box-shadow:var(--shadow)}
  .who-card:hover{background:var(--hover);border-color:rgba(255,255,255,.24)}
  .who-card .avatar{width:52px;height:52px;font-size:17px}
  .who-card .nm{font-weight:800;font-size:14px}
  .who-pin{margin-top:20px;max-width:260px}
  .who-shake{animation:whoshake .32s}
  @keyframes whoshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  /* Rep mode: the office screens leave the drawer entirely. */
  body.rep .nav a[data-view="customers"],
  body.rep .nav a[data-view="plans"],body.rep .nav a[data-view="messages"],
  body.rep .nav a[data-view="team"],body.rep .nav a[data-view="reports"],
  body.rep .nav a[data-view="settings"]{display:none}
  .nav-square{display:flex;align-items:center;gap:12px;padding:9px 12px;margin:0 12px 8px;border-radius:9px;
    color:var(--muted);font-weight:600;font-size:14px}
  .nav-square:hover{background:var(--hover);color:var(--ink);text-decoration:none}
  .lb-row.me{border:1px solid var(--brand);border-radius:12px;background:var(--brand-soft);margin:6px 10px}
  .rep-delta{padding:0 18px 13px;color:var(--muted);font-size:12.5px;font-style:italic}

  /* ---------- Buttons ---------- */
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 15px;font-weight:700;
    color:var(--ink);font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn-primary{background:var(--sky);border-color:transparent;color:var(--on-sky)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-green{background:var(--green);border-color:transparent;color:#052e1e}
  .btn-green:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{background:var(--gray-soft);color:var(--ink)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:0;background:transparent;padding:8px 15px;font-weight:700;color:var(--muted);font-size:13px;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.active{background:rgba(255,255,255,.1);color:var(--ink)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar select,.toolbar input{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--field-bg);color:var(--ink);font-weight:600}

  /* ---------- Greeting + stats ---------- */
  .hero{margin:4px 0 22px}
  .fh-greet{font-size:30px;font-weight:700;font-style:italic;letter-spacing:-.5px;line-height:1.15}
  .fh-name{font-size:30px;font-weight:700;font-style:italic;color:var(--brand);line-height:1.15}
  .fh-sub{color:var(--faint);font-style:italic;margin-top:3px;font-size:14px}
  .big-num{font-size:32px;font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin:2px 0 6px}
  .ftab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:999px}
  .ftab.active{color:var(--purple)}
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line)}
  .lb-rank{color:var(--muted);font-size:12px;width:18px;flex-shrink:0;font-weight:700}
  .lb-comm{color:var(--brand);font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
  .stat .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .stat .num{font-size:27px;font-weight:800;margin-top:3px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .stat .meta{font-size:12px;color:var(--faint);font-weight:600;margin-top:3px}
  .stat.link{cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s}
  .stat.link:hover{border-color:rgba(255,255,255,.32);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .ic.blue{background:var(--brand-soft);color:var(--brand)} .ic.green{background:var(--green-soft);color:var(--green)}
  .ic.amber{background:var(--amber-soft);color:var(--amber)} .ic.red{background:var(--red-soft);color:var(--red)}
  .ic.purple{background:var(--purple-soft);color:var(--purple)} .ic.cyan{background:var(--cyan-soft);color:var(--cyan)}
  .chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .schip{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:104px}
  .schip .l{font-size:11px;color:var(--muted);font-weight:700;font-style:italic}
  .schip .n{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}

  /* ---------- Panels + tables ---------- */
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .panel h2{margin:0;padding:15px 18px;font-size:15px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .panel h2 .pill{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--gray-soft);border-radius:20px;padding:2px 9px}
  .panel-pad{padding:18px}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
    padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;background:var(--panel2)}
  thead th.r{text-align:right}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody td.r{text-align:right}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:rgba(255,255,255,.05)}
  tbody tr:last-child td{border-bottom:0}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#0b0c10;font-size:13px}
  .nm{font-weight:700} .sub{color:var(--muted);font-size:12.5px}
  .tag{display:inline-block;background:var(--gray-soft);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;margin:1px 3px 1px 0}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .b-new{background:var(--gray-soft);color:var(--muted)} .b-contacted{background:var(--cyan-soft);color:var(--cyan)}
  .b-quoted{background:var(--amber-soft);color:var(--amber)} .b-won{background:var(--green-soft);color:var(--green)}
  .b-lost{background:var(--red-soft);color:var(--red)}
  .b-scheduled{background:var(--brand-soft);color:var(--brand)} .b-done{background:var(--green-soft);color:var(--green)}
  .b-cancelled{background:var(--red-soft);color:var(--red)}
  .b-draft{background:var(--gray-soft);color:var(--muted)} .b-sent{background:var(--brand-soft);color:var(--brand)}
  .b-paid{background:var(--green-soft);color:var(--green)} .b-overdue{background:var(--red-soft);color:var(--red)}
  .b-proposed{background:var(--brand-soft);color:var(--brand)} .b-active{background:var(--green-soft);color:var(--green)}
  .b-owner{background:var(--purple-soft);color:var(--purple)} .b-manager{background:var(--brand-soft);color:var(--brand)}
  .b-sales{background:var(--amber-soft);color:var(--amber)} .b-tech{background:var(--gray-soft);color:var(--muted)}
  .money{font-weight:700;font-variant-numeric:tabular-nums}
  .money.pos{color:var(--green)} .money.owe{color:var(--red)}
  .empty{padding:46px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px;opacity:.6}
  .empty .et{font-weight:800;color:var(--ink);font-size:15px}
  .empty .es{font-size:13px;color:var(--faint);margin-top:5px;font-style:italic}

  /* ---------- Lead / customer cards ---------- */
  .lead-grp{margin-bottom:18px}
  .lg-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
  .lg-bar{width:3px;height:30px;border-radius:3px;flex-shrink:0}
  .lg-label{font-weight:800;font-size:13.5px}
  .lg-count{color:var(--faint);font-size:11.5px;font-weight:600}
  .lg-total{margin-left:auto;color:var(--sky);font-weight:800;font-variant-numeric:tabular-nums}
  .lead-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
  .lead-card:hover{border-color:rgba(255,255,255,.22)}
  .lc-mid{flex:1;min-width:0}
  .lc-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .lchip{background:rgba(86,184,245,.16);color:var(--sky);border-radius:999px;padding:3px 10px;font-weight:800;
    font-size:12.5px;font-variant-numeric:tabular-nums}
  .lc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .lc-tags .lchip{padding:2px 8px;font-size:11px}
  .lc-arrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#0d0e12;color:var(--muted);flex-shrink:0;font-size:14px}
  .ph-pill{display:inline-block;background:#0d0e12;border:1px solid var(--line);border-radius:999px;padding:2px 9px;
    font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
  .lead-total{text-align:left;font-style:italic;color:var(--faint);font-size:12.5px;margin:14px 0 4px;font-weight:600}
  .lx-title{position:relative;font-size:30px;font-weight:800;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .lx-title select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .lx-chev{color:var(--muted);font-size:18px}
  .lx-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .list-foot{display:flex;align-items:center;gap:8px;margin-top:14px}
  .list-foot .lead-total{margin:0;flex:1}
  .list-foot .fpill,.list-foot .fcir{height:32px;font-size:12px;padding:0 12px}
  .list-foot .fcir{width:32px;padding:0}

  /* ---------- Day timeline ---------- */
  .tl-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;row-gap:8px;justify-content:flex-start;text-align:left;margin:2px 0 4px}
  .tl-head .nb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tlh-wrap{flex:1;min-width:0}
  .tlh-dow{color:var(--muted);font-size:14px;font-weight:600;text-align:left;font-style:italic}
  .tlh-date{font-size:26px;font-weight:800;text-align:left;letter-spacing:-.3px}
  .tl-rev{text-align:left;color:var(--muted);font-size:13px;margin:4px 0 0;font-style:italic}
  .tl-row{display:flex;gap:10px;border-top:1px solid var(--line);min-height:54px}
  .tl-hour{width:52px;flex-shrink:0;color:var(--faint);font-size:11px;font-weight:700;padding-top:8px;text-align:right}
  .tl-slot{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
  .tl-card{background:linear-gradient(135deg,#1c3f66,#2a6ba8);border-radius:14px;padding:10px 12px;min-width:150px;max-width:100%;cursor:pointer;flex:1 1 150px}
  .tl-card.done{background:linear-gradient(135deg,#14532d,#166534)}
  .tl-card .n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-card .s{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:1px}
  .tl-card .tr{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:1px}
  .tl-card .p{font-weight:800;font-size:14px;margin-top:6px}
  .tl-slot{cursor:pointer}
  .tl-item{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:rgba(255,255,255,.9);padding:1px 0}
  /* ---------- Week view ---------- */
  .week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 4px}
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:10px}
  .week-col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:120px;cursor:pointer}
  .week-col.today{border-color:var(--brand)}

  .week-card .wp{font-size:11.5px;font-weight:800;margin-top:2px}
  .wk-item{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:rgba(255,255,255,.9)}
  .week-empty{color:var(--faint);font-size:11.5px;text-align:center;padding:14px 0;font-style:italic}
  /* ---------- Job form crew picker ---------- */
  .crew-row{display:flex;gap:12px;flex-wrap:wrap}

  /* ---------- Modal ---------- */

  .modal{background:#15161c;border:1px solid var(--line);border-radius:20px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);margin:auto 0}
  .modal.lg{max-width:760px} .modal.sm{max-width:520px}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .modal-head h3{margin:0;font-size:18px;font-weight:800}
  .modal-head .hsub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
  .x{border:0;background:transparent;font-size:24px;color:var(--faint);line-height:1;padding:2px 7px;border-radius:8px}
  .x:hover{background:var(--hover);color:var(--ink)}
  .modal-body{padding:20px 22px;max-height:70vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

  .modal-foot .del{margin-right:auto;color:var(--red);border-color:rgba(248,113,113,.35);background:var(--red-soft)}
  .modal-foot .del:hover{background:rgba(248,113,113,.22)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
  .field{margin-bottom:13px}
  .field label{display:block;font-weight:700;margin-bottom:5px;font-size:12.5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
    outline:none;background:var(--field-bg);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .field textarea{resize:vertical;min-height:62px}
  .field .pre{position:relative}
  .field .pre input{padding-left:26px} .field .pre .sym{position:absolute;left:11px;top:9px;color:var(--muted);font-weight:700}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;margin:20px 0 11px;display:flex;align-items:center;gap:8px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .hint{color:var(--muted);font-size:12px;margin-top:5px}
  .note{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--muted)}
  .note b{color:var(--ink)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

  .totbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:4px 0}
  .totbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-align:center}
  .totbox .l{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
  .totbox .n{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
  .jobline{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}

  /* ---------- Plan / quote sheet ---------- */
  .qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 16px}
  .qm{background:#0d0e12;border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center;font-weight:700;font-size:12.5px;color:var(--ink)}

  .qnotes{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px;margin-top:3px}
  #sig-pad{width:100%;height:180px;background:#0d0e12;border:1px solid var(--line);border-radius:14px;touch-action:none;display:block}

  /* ---------- Team / Payroll ---------- */
  .line-row{display:grid;gap:8px;align-items:center;margin-bottom:8px}
  .line-row input,.line-row select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--field-bg);color:var(--ink);font-size:13px}

  .msg-acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

  /* ---------- Pill bar (shared status tabs: plans) ---------- */
  .map-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mpill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:12.5px}
  .mpill:hover{background:var(--hover);color:var(--ink)}
  .mpill.active{background:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(255,255,255,.28)}
  .mpill .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .mpill .n{font-variant-numeric:tabular-nums;color:var(--faint)}
  .mpill.active .n{color:var(--ink)}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#15161c;color:var(--ink);
    border:1px solid var(--line);padding:12px 20px;border-radius:11px;opacity:0;transition:.25s;z-index:200;font-weight:700;
    box-shadow:var(--shadow-lg);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#7f1d1d} .toast.ok{background:#0c633a}

  /* ---------- Charts ---------- */
  .adot{transition:filter .13s,r .13s}
  .acol{cursor:default}
  .acol:hover .adot{filter:brightness(1.2) drop-shadow(0 2px 7px rgba(139,92,246,.6))}
  .chart-tip{position:fixed;z-index:150;background:#15161c;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
    box-shadow:var(--shadow-lg);white-space:nowrap;line-height:1.35}
  .chart-tip.show{opacity:1;transform:translateY(0)}
  .chart-tip .tl{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em}
  .chart-tip .tv{color:var(--green);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}

  /* ---------- Phone / PWA ---------- */
  @media(max-width:860px){
    .grid-2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
    /* top padding clears the Dynamic Island / status bar + the floating hamburger */
    .content{padding:calc(var(--safetop, env(safe-area-inset-top, 0px)) + 62px) 14px 110px}
    .panel{overflow-x:auto}
    input,select,textarea{font-size:16px} /* 16px stops iOS zoom-on-focus */
    /* Phone: ONE scroll container — the overlay scrolls the whole modal (inner scroll areas fight iOS momentum + the keyboard) */
    .overlay{padding:calc(var(--safetop, env(safe-area-inset-top)) + 52px) 8px calc(env(safe-area-inset-bottom) + 40px);backdrop-filter:none}
    .modal-body{max-height:none;overflow:visible}
    .jobcard{flex-wrap:wrap}
    .jobcard .actions{max-width:none}
    .totbar{gap:8px}.totbox{padding:10px 8px}.totbox .n{font-size:15px}
  }
</style>
</head>

<script>
"use strict";
/* =========================================================
   Flyra — single-file field-service CRM.
   Everything lives in this browser (localStorage). No network at startup.
   ========================================================= */

/* ---------------- Helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Amounts are pinned to en-US grouping: the "$" prefix and a "1 234,50" body disagree,
   and a machine with a European locale would otherwise print exactly that. */
function money(n){n=+n||0;const neg=n<0;n=Math.abs(n);
  const s=n%1===0?n.toLocaleString("en-US"):n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?"-$":"$")+s;}
function money2(n){return "$"+(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyShort(n){n=+n||0;const a=Math.abs(n);
  if(a>=1000)return "$"+(n/1000).toFixed(a%1000===0?0:1)+"k";return "$"+Math.round(n);}
/* LOCAL calendar date — never toISOString(), which is UTC and rolls to "tomorrow" every
   evening (Toronto UTC-4/5): typed at 8pm Aug 14, the app would think it is Aug 15. */
function localISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return localISO(new Date());}
function offset(n){const d=new Date();d.setDate(d.getDate()+n);return localISO(d);}
function fmtDate(d,opt){if(!d)return"—";const x=new Date(d+"T00:00:00");
  return x.toLocaleDateString(undefined,opt||{month:"short",day:"numeric",year:"numeric"});}
function fmtDateShort(d){if(!d)return"—";const x=new Date(d+"T00:00:00");return x.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function fmtDow(d){if(!d)return"";const x=new Date(d+"T00:00:00");return x.toLocaleDateString(undefined,{weekday:"short"});}
function fmtTime(t){if(!t)return"";const[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";const hh=((h+11)%12)+1;
  return hh+":"+String(m).padStart(2,"0")+" "+ap;}
function fmtWhen(ts){return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function initials(name){const p=(name||"").trim().split(/\s+/);return ((p[0]||"")[0]||"?").toUpperCase()+((p[1]||"")[0]||"").toUpperCase();}
function firstName(n){return (n||"").trim().split(/\s+/)[0]||"";}
function avatarColor(name){name=name||"";let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);
  const c=["#38bdf8","#34d399","#a78bfa","#fbbf24","#fb7185","#5ac8fa","#f472b6","#a3e635"];return c[Math.abs(h)%c.length];}
function cleanNum(p){return (p||"").replace(/[^\d+]/g,"");}
function fmtPhone(p){const d=(p||"").replace(/[^\d]/g,"");
  if(d.length===10)return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
  if(d.length===11&&d[0]==="1")return "("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7);
  return p||"";}
function niceCeil(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;
  const nf=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return nf*p;}
/* ---- Chart lib (ported from Desktop\CRM.html — owner's code) ----
   Draws at the real container width so a phone gets a chart built for its screen. */
function chartGeo(data,height){
  const cEl=$("#content");
  const W=Math.max(300,((cEl&&cEl.offsetWidth)||900)-64),H=height,padL=48,padR=16,padT=22,padB=26;
  const cw=W-padL-padR,ch=H-padT-padB,n=data.length;
  const niceMax=niceCeil(Math.max(1,...data.map(d=>d.value))),ticks=4;
  const step=Math.max(1,Math.ceil(n/Math.max(4,Math.floor(cw/58)))),showLbl=i=>i%step===0||i===n-1;
  const maxV=Math.max(0,...data.map(d=>d.value));
  let grid="";
  for(let i=0;i<=ticks;i++){const y=padT+ch-(ch*i/ticks);
    grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.12)" stroke-width="1"/>';
    grid+='<text x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" font-style="italic" fill="#6b7280">'+moneyShort(niceMax*i/ticks)+'</text>';}
  return {W,H,padL,padR,padT,padB,cw,ch,n,niceMax,ticks,step,showLbl,maxV,grid};
}
function svgWrap(g,inner,defs){
  return '<svg viewBox="0 0 '+g.W+' '+g.H+'" width="100%" height="'+g.H+'" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%">'+
    (defs||"")+g.grid+inner+'</svg>';
}
/* Smooth cubic path through points (Catmull-Rom → bezier), clamped to the plot area. */
function smoothPath(pts,yMin,yMax){
  if(pts.length<3)return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const cl=y=>Math.max(yMin,Math.min(yMax,y));
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    d+="C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+" "+cl(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+" "+
      (p2[0]-(p3[0]-p1[0])/6).toFixed(1)+" "+cl(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d;
}
/* The revenue chart — one style everywhere: a smooth filled purple area. */
function areaChartSVG(data,height){
  height=height||230; const g=chartGeo(data,height); const base=g.padT+g.ch;
  const X=i=>g.n<=1?g.padL+g.cw/2:g.padL+g.cw*i/(g.n-1), Y=v=>g.padT+g.ch-g.ch*(v/g.niceMax);
  const pts=data.map((d,i)=>[X(i),Y(d.value)]);
  const path=smoothPath(pts,g.padT,base);
  const area='<path d="'+path+' L '+pts[pts.length-1][0].toFixed(1)+' '+base.toFixed(1)+' L '+pts[0][0].toFixed(1)+' '+base.toFixed(1)+' Z" fill="url(#areagrad)" stroke="none"/>';
  const glow='<path d="'+path+'" fill="none" stroke="rgba(139,92,246,.35)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>';
  const line='<path d="'+path+'" fill="none" stroke="url(#linegrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  const baseline='<line x1="'+g.padL+'" y1="'+base.toFixed(1)+'" x2="'+(g.W-g.padR).toFixed(1)+'" y2="'+base.toFixed(1)+'" stroke="rgba(255,255,255,.15)" stroke-width="1.25"/>';
  let cols="",labels="";
  data.forEach((d,i)=>{const[x,y]=pts[i];
    if(d.value>0&&(i===data.length-1||d.value===g.maxV))labels+='<text x="'+x.toFixed(1)+'" y="'+(y-12).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" font-style="italic" fill="#f2f9ff">'+moneyShort(d.value)+'</text>';
    if(g.showLbl(i))labels+='<text x="'+x.toFixed(1)+'" y="'+(g.H-8)+'" text-anchor="middle" font-size="10.5" fill="#9aa1ab" font-weight="600" font-style="italic">'+esc(d.label)+'</text>';
    const gap=g.cw/Math.max(1,g.n);
    cols+='<g class="acol" data-lbl="'+esc(d.label+(d.year?(" "+d.year):""))+'" data-val="'+esc(money(d.value))+'">'+
      '<rect x="'+(x-gap/2).toFixed(1)+'" y="'+g.padT.toFixed(1)+'" width="'+gap.toFixed(1)+'" height="'+(g.ch+6).toFixed(1)+'" fill="transparent"/>'+
      '<circle class="adot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.5" fill="#0b0c10" stroke="#8b5cf6" stroke-width="2.5"/></g>';});
  const defs='<defs>'+
    '<linearGradient id="areagrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(139,92,246,.45)"/><stop offset=".7" stop-color="rgba(139,92,246,.08)"/><stop offset="1" stop-color="rgba(139,92,246,0)"/></linearGradient>'+
    '<linearGradient id="linegrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>'+
    '</defs>';
  return svgWrap(g,area+glow+line+baseline+labels+cols,defs);
}
/* Hover tooltip shared by every chart. Re-bound after each render that draws one. */
function bindChartTips(){
  const tip=$("#chart-tip"); if(!tip)return;
  document.querySelectorAll(".acol").forEach(el=>{
    el.addEventListener("mouseenter",()=>{tip.innerHTML='<div class="tl">'+esc(el.dataset.lbl||"")+'</div><div class="tv">'+esc(el.dataset.val||"")+'</div>';tip.classList.add("show");});
    el.addEventListener("mousemove",e=>{const w=innerWidth,x=e.clientX;
      tip.style.left=(x>w-160?x-14-tip.offsetWidth:x+14)+"px";tip.style.top=(e.clientY-12)+"px";});
    el.addEventListener("mouseleave",()=>tip.classList.remove("show"));
  });
}

function normalize(r){
  r=r||{};
  r.v=1;
  const d=DEFAULT_SETTINGS();
  if(!r.settings||typeof r.settings!=="object")r.settings=d;
  const s=r.settings;
  if(!s.business)s.business=d.business;
  if(!Array.isArray(s.services)||!s.services.length)s.services=d.services;
  if(!Array.isArray(s.templates)||!s.templates.length)s.templates=d.templates;
  if(typeof s.goal!=="number")s.goal=d.goal;
  s.automation=Object.assign({},d.automation,s.automation||{});
  s.stripe=Object.assign({},d.stripe,s.stripe||{});
  if(typeof s.smsNumber!=="string")s.smsNumber="";
  s.ownerPin=/^\d{4,8}$/.test(String(s.ownerPin||""))?String(s.ownerPin):"";
  if(!s.tier)s.tier=d.tier;
  s.terms=Object.assign({},d.terms,s.terms||{});
  if(!isFinite(+s.terms.cancelFeePct))s.terms.cancelFeePct=d.terms.cancelFeePct;else s.terms.cancelFeePct=+s.terms.cancelFeePct;
  if(typeof s.terms.text!=="string")s.terms.text=d.terms.text;
  for(const k of ["users","customers","jobs","invoices","plans","pins","messages","equipment","expenses","payouts"])
    if(!Array.isArray(r[k]))r[k]=[];
  // per-row guards — a hand-edited or older file must never crash a renderer
  r.customers.forEach(c=>{
    if(!Array.isArray(c.tags))c.tags=[];
    if(!Array.isArray(c.log))c.log=[];
    if(!c.stage||!STAGES.some(x=>x.id===c.stage))c.stage="new";
  });
  r.jobs.forEach(j=>{
    if(!Array.isArray(j.crewIds))j.crewIds=[];
    j.price=+j.price||0;j.collected=+j.collected||0;
    if(!["scheduled","done","cancelled"].includes(j.status))j.status="scheduled";
    // per-job commission truth (F12): defaults to "nobody, nothing" — old-CRM fidelity over
    // the blanket customer.ownerId guess. closerId=0 is not a valid user id, so it collapses to null.
    j.closerId=j.closerId?+j.closerId||null:null;
    j.commissionPct=+j.commissionPct||0;
    j.termsAcceptedAt=+j.termsAcceptedAt||0;
  });
  r.invoices.forEach(i=>{
    if(!Array.isArray(i.lines))i.lines=[];
    if(!Array.isArray(i.jobIds))i.jobIds=[];
    if(!Array.isArray(i.payments))i.payments=[];
    i.total=+i.total||0;
    if(!["draft","sent","paid","overdue"].includes(i.status))i.status="draft";
  });
  r.plans.forEach(p=>{
    if(!Array.isArray(p.months))p.months=[];
    p.perVisit=+p.perVisit||0;p.visitsPerYear=+p.visitsPerYear||0;p.initialPrice=+p.initialPrice||0;
    if(typeof p.service!=="string")p.service="";
    if(typeof p.notes!=="string")p.notes="";
    if(!p.firstVisit)p.firstVisit=today();
    p.cardOnFile=!!p.cardOnFile;
    if(!["proposed","active","cancelled"].includes(p.status))p.status="proposed";
  });
  r.messages.forEach(m=>{if(!m.dir)m.dir="out";if(!m.status)m.status="queued";
    if(!MSG_KINDS[m.kind])m.kind="manual";
    if(typeof m.body!=="string")m.body="";
    if(!m.dueAt)m.dueAt=today();});
  r.payouts.forEach(p=>{p.amount=+p.amount||0;if(!p.period)p.period="";if(!p.t)p.t=Date.now();});
  // sequences: always max(id)+1 so normalize() is idempotent
  const seqOf=list=>Math.max(0,...list.map(x=>+x.id||0))+1;
  r.seqU=seqOf(r.users);r.seqC=seqOf(r.customers);r.seqJ=seqOf(r.jobs);r.seqI=seqOf(r.invoices);
  r.seqP=seqOf(r.plans);r.seqPin=seqOf(r.pins);r.seqM=seqOf(r.messages);
  r.seqE=seqOf(r.equipment);r.seqX=seqOf(r.expenses);r.seqPay=seqOf(r.payouts);
  return r;
}

/* Collected, bucketed by calendar month, trailing n months (current month included). */
function revenueByMonth(n){
  const out=[];const base=new Date();base.setDate(1);
  for(let i=n-1;i>=0;i--){const dt=new Date(base.getFullYear(),base.getMonth()-i,1);
    const ym=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");
    const total=db.jobs.filter(j=>j.status!=="cancelled"&&(j.date||"").slice(0,7)===ym).reduce((s,j)=>s+(+j.collected||0),0);
    out.push({ym,label:dt.toLocaleDateString(undefined,{month:"short"}),year:dt.getFullYear(),total});}
  return out;
}
/* Revenue card series for the period seg (week/month/quarter/year/all). */
function revenueSeries(period){
  const now=new Date();
  const sumRange=(from,to)=>db.jobs.filter(j=>j.status!=="cancelled"&&j.date>=from&&j.date<=to).reduce((s,j)=>s+(+j.collected||0),0);
  const daily=days=>{const out=[];for(let i=days-1;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const ds=localISO(d);out.push({label:(d.getMonth()+1)+"/"+d.getDate(),value:sumRange(ds,ds)});}return out;};
  if(period==="week")return daily(7);
  if(period==="month")return daily(30);
  if(period==="quarter"){const out=[];for(let i=12;i>=0;i--){const end=new Date(now);end.setHours(0,0,0,0);end.setDate(end.getDate()-i*7);
    const start=new Date(end);start.setDate(start.getDate()-6);out.push({label:(start.getMonth()+1)+"/"+start.getDate(),value:sumRange(localISO(start),localISO(end))});}
    return out;}
  if(period==="year")return revenueByMonth(12).map(m=>({label:m.label,year:m.year,value:m.total}));
  const dates=db.jobs.filter(j=>j.date).map(j=>j.date).sort();
  if(!dates.length)return revenueByMonth(1).map(m=>({label:m.label,year:m.year,value:m.total}));
  const fd=new Date(dates[0].slice(0,7)+"-01");
  const months=(now.getFullYear()-fd.getFullYear())*12+(now.getMonth()-fd.getMonth())+1;
  return revenueByMonth(Math.max(1,months)).map(m=>({label:m.label,year:m.year,value:m.total}));
}
/* ARR tab: trailing-12-month collected total, and a cumulative-by-month series for this year. */
function arrTotal(){return revenueByMonth(12).reduce((s,m)=>s+m.total,0);}
function arrSeries(){
  const Y=today().slice(0,4);let run=0;
  return revenueByMonth(12).filter(m=>String(m.year)===Y).map(m=>({label:m.label,year:m.year,value:(run+=m.total)}));
}
/* "Daily avg" and "Peak" stat chips under the revenue card — both scoped to the current month. */
function dashChips(){
  const t=today(),ym=t.slice(0,7),dayNum=+t.slice(8,10);
  const inMon=db.jobs.filter(j=>j.status!=="cancelled"&&(j.date||"").slice(0,7)===ym);
  const monthTotal=inMon.reduce((s,j)=>s+(+j.collected||0),0);
  const byDay={};inMon.forEach(j=>{if(j.date)byDay[j.date]=(byDay[j.date]||0)+(+j.collected||0);});
  return {dailyAvg:monthTotal/Math.max(1,dayNum),peak:Math.max(0,...Object.values(byDay))};
}
/* Commission fidelity (F12): the OLD import bug attributed commission via customer.ownerId x
   user.commissionPct across EVERY job that customer ever had — wildly inflating payroll versus
   the old CRM's real per-job closedBy+commissionPct truth. The fix: a job's own closerId+
   commissionPct always wins. Only when a job carries NEITHER (never touched a per-job closer,
   e.g. jobs created before this feature existed) do we fall back to the customer's owning rep —
   and even then only if that rep actually has a commission rate on file, so a $0-rate owner
   attributes nothing. */
function userRate(id){const u=userById(id);return u?+u.commissionPct||0:0;} // the rep's configured rate (Team screen)
function jobCloserId(j){ // who gets credit for this job at all: its own closer, else the customer's rep
  if(j.closerId)return j.closerId;
  const c=custById(j.customerId);return c?c.ownerId:null;
}
/* Split commission (Change A): a job with a non-empty j.splits array is credited ONLY through that
   array — closerId/commissionPct are ignored on that job. Otherwise the single-closer rule applies
   (explicit closerId+commissionPct stamp only — no ownerId fallback, that inflated imported books). */
function jobCredits(j){
  const price=+j.price||0;
  if(Array.isArray(j.splits)&&j.splits.length)
    return j.splits.map(s=>({userId:s.userId,pct:+s.pct||0,
      amount:price*(+s.pct||0)/100,salesShare:price/j.splits.length}));
  // A stamped closer at 0% (the owner's own closes) still gets the SALE credit — only the
  // commission amount is zero. Requiring pct>0 here would wipe the owner off the leaderboard.
  if(j.closerId)
    return [{userId:j.closerId,pct:+j.commissionPct||0,amount:price*(+j.commissionPct||0)/100,salesShare:price}];
  return [];
}
function jobCreditedTo(j,userId){return jobCredits(j).some(c=>c.userId===userId);}
function jobCommission(j){ // {userId,amount} the job actually owes, or null if nobody earns anything.
  // Only what's stamped on the job counts — createJob materializes the rep's rate at creation,
  // so a read-time fallback would double-guess history (it inflated imported books 8x).
  const c=jobCredits(j)[0];
  return c?{userId:c.userId,amount:c.amount}:null;
}
/* Top Salespeople — done jobs in a period, credited per job via jobCredits (splits, or the single
   stamped closer). `key` is a payPeriodKey() string ("YYYY-MM" or "YYYY"); omitted = this month. */
function leaderboardRows(metric,key){
  const ym=key||today().slice(0,7);
  const byUser={};
  db.jobs.filter(j=>j.status==="done"&&jobInPeriod(j.date,ym)).forEach(j=>{
    jobCredits(j).forEach(cr=>{
      const o=byUser[cr.userId]=byUser[cr.userId]||{sales:0,count:0,comm:0};
      o.sales+=cr.salesShare;o.comm+=cr.amount;o.count+=1;
    });
  });
  return Object.entries(byUser).map(([uid,v])=>{
    const u=userById(+uid);if(!u)return null;
    return {user:u,sales:v.sales,count:v.count,comm:v.comm};
  }).filter(Boolean).sort((a,b)=>metric==="commission"?b.comm-a.comm:b.sales-a.sales);
}
/* Rep "My money" drill-down: the exact jobs behind the commission headline, no recomputation.
   leaderboardRows only ever counts DONE jobs into comm, so doneTotal here is computed the same
   way (status==="done", jobCredits credited to userId) and always equals that headline number.
   Booked (not-yet-done) jobs the rep is credited for come back too, but as a separate bookedTotal
   — they were never in the headline, so they never get folded into it. */
function repCommRows(userId,key){
  const rows=[];
  db.jobs.forEach(j=>{
    if(j.status==="cancelled"||!jobInPeriod(j.date,key))return;
    jobCredits(j).filter(cr=>cr.userId===userId).forEach(cr=>{
      rows.push({job:j,amount:cr.amount,done:j.status==="done"});
    });
  });
  rows.sort((a,b)=>(a.job.date||"").localeCompare(b.job.date||""));
  return {rows,
    doneTotal:rows.filter(r=>r.done).reduce((s,r)=>s+r.amount,0),
    bookedTotal:rows.filter(r=>!r.done).reduce((s,r)=>s+r.amount,0)};
}
/* Today strip: today's job count + expected revenue (booked scheduled + collected done). */
function todayStats(){
  const t=today();
  const todays=db.jobs.filter(j=>j.date===t&&j.status!=="cancelled");
  const rev=todays.reduce((s,j)=>s+(j.status==="done"?(+j.collected||0):(+j.price||0)),0);
  return {count:todays.length,rev};
}
/* Priorities: overdue scheduled jobs, due queued texts — max 5. */
function todayPriorities(){
  const t=today();
  const items=[];
  db.jobs.filter(j=>j.status==="scheduled"&&j.date<t).forEach(j=>{
    const c=custById(j.customerId);
    items.push({icon:"⚠️",text:"Overdue — "+(c?c.name:"customer")+"'s "+j.service+" was due "+fmtDateShort(j.date),view:"schedule"});});
  db.messages.filter(m=>m.status==="queued"&&m.dueAt<=t).forEach(m=>{
    const c=custById(m.customerId);
    items.push({icon:"💬",text:(m.kind==="review"?"Review request":"Follow-up text")+" due — "+(c?c.name:"customer"),view:"messages"});});
  return items.slice(0,5);
}
/* Activity feed: every customer's log, flattened and time-sorted, newest first. */
function activityFeed(){
  const rows=[];
  db.customers.forEach(c=>c.log.forEach(l=>rows.push({t:l.t,m:l.m,name:c.name})));
  rows.sort((a,b)=>b.t-a.t);
  return rows.slice(0,8);
}

const REP_VIEWS=["dashboard","schedule","leads"]; // everything else is office work

    '<input id="who-pin-in" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></div>'+

let schedDay=today();               // ISO day the timeline/week centers on — in-memory only
let schedView=uiPref().schedView||"day"; // day | week — persisted across sessions via uiSet
let schedCrew="all";                // "all" or a user id — in-memory only
let editJob=null;                   // job id open in the modal, null while creating

function tlTimeRange(t){if(!t)return"";const[h,m]=t.split(":").map(Number);let eh=h+1,em=m;if(eh>23){eh=23;em=59;}
  return fmtTime(t)+" - "+fmtTime(eh+":"+em);}
/* Jobs on one day, crew-filtered. Empty crewIds means "everyone", so it always passes the filter. */
function dayJobs(date){
  let jobs=db.jobs.filter(j=>j.date===date&&j.status!=="cancelled");
  if(schedCrew!=="all")jobs=jobs.filter(j=>!j.crewIds.length||j.crewIds.includes(schedCrew));
  return jobs.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
}
function dayRev(date){return dayJobs(date).reduce((s,j)=>s+(j.status==="done"?(+j.collected||0):(+j.price||0)),0);}
/* The Monday-start week containing an ISO date, as 7 ISO strings. */
function weekDates(iso){
  const d=new Date(iso+"T12:00:00");
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  const out=[];for(let i=0;i<7;i++){out.push(localISO(d));d.setDate(d.getDate()+1);}
  return out;
}

/* --- job data ops (the modal calls these, so the gate can drive the same code path) --- */
function createJob(data){
  const j=Object.assign({id:db.seqJ++,status:"scheduled",collected:0,payMethod:"",signature:"",
    signedAt:0,invoiceId:null,planId:null,completedAt:0,createdAt:Date.now(),
    closerId:null,commissionPct:0,termsAcceptedAt:0},data);
  // Commission is decided the moment a job is born, never inferred later — if the customer's
  // rep earns a rate and no closer was chosen explicitly, stamp the rep onto the job now.
  if(!j.closerId&&!(+j.commissionPct)){
    const c=custById(j.customerId),u=c&&c.ownerId?userById(c.ownerId):null;
    if(u&&(+u.commissionPct||0)>0){j.closerId=u.id;j.commissionPct=+u.commissionPct;}
  }
  db.jobs.push(j);save();return j;
}
function updateJob(id,data){const j=db.jobs.find(x=>x.id===id);if(!j)return null;Object.assign(j,data);save();return j;}
function deleteJob(id){db.jobs=db.jobs.filter(x=>x.id!==id);save();}
/* Done flow: stamp status+completedAt, ask what was collected, log it on the customer. */
function completeJobFlow(id){
  const j=db.jobs.find(x=>x.id===id);if(!j)return null;
  j.status="done";if(!j.completedAt)j.completedAt=Date.now();
  const price=+j.price||0;
  const paid=price>0&&confirm("Collected "+money(price)+"?");
  j.collected=paid?price:0;
  const c=custById(j.customerId);
  if(c){c.log=c.log||[];c.log.push({t:Date.now(),m:"Completed "+j.service+" — "+(paid?"collected "+money(price):"unpaid")});}
  save();
  if(j.planId)ensurePlanJobs(); // a plan visit is done — queue its next one
  return j;
}
/* Fat-finger insurance: put a done job back on the schedule. Collected money is zeroed (it was
   never real if the Done was accidental) — the old amount is kept in the customer's log. */
function uncompleteJob(id){
  const j=db.jobs.find(x=>x.id===id);if(!j||j.status!=="done")return null;
  const had=+j.collected||0;
  j.status="scheduled";j.completedAt=0;j.collected=0;j.payMethod="";
  const c=custById(j.customerId);
  if(c){c.log=c.log||[];c.log.push({t:Date.now(),m:"Back to scheduled — Done undone"+(had?" (had $"+had.toFixed(2)+" collected, now cleared)":"")});}
  save();return j;
}

/* Fold same customer+date+time jobs into one display group (data/money untouched — this is
   rendering-only). Order of first appearance is preserved, so callers must pre-sort jobs. */
function groupSlotJobs(jobs){
  const groups=[]; // ponytail: linear find() over a same-day slot list (a handful of jobs) — a Map isn't worth it here
  for(const j of jobs){
    const g=groups.find(g=>g.job.customerId===j.customerId&&g.job.date===j.date&&(g.job.time||"")===(j.time||""));
    if(g)g.jobs.push(j);else groups.push({jobs:[j],job:j});
  }
  groups.forEach(g=>{g.services=g.jobs.map(x=>x.service).join(" + ");g.total=g.jobs.reduce((s,x)=>s+(+x.price||0),0);});
  return groups;
}

/* One card per slot GROUP (see groupSlotJobs). A solo group renders exactly like tlCard always
   did. A merged group shows the combined services/total and one clickable row per job, each
   still carrying its own data-jobcard so a tap on a row opens that job specifically. */
function tlGroupCard(g){
  if(g.jobs.length===1)return tlCard(g.job);

  return '<div class="tl-card '+(done?"done":"")+'" data-jobcard="'+j.id+'">'+
    '<div class="n">'+(done?"✓ ":"")+esc(c.name)+'</div>'+
    rows+

    '<div style="margin-top:14px"><button class="btn btn-primary" id="empty-add-sched">＋ New Job</button></div></div></div>';

  let body=anytime.length?'<div class="tl-row"><div class="tl-hour">Anytime</div><div class="tl-slot">'+anytime.map(tlGroupCard).join("")+'</div></div>':"";
  for(let h=6;h<=21;h++){
    const list=groupSlotJobs(jobs.filter(j=>{if(!j.time)return false;const jh=Math.min(21,Math.max(6,parseInt(j.time,10)||0));return jh===h;}));

      const shared={customerId:cid,date,time,durMin,notes};
      // Same isSplit guard as the solo path — a split job's credit is data-level only, never
      // overwritten from this form. Rate comes from the rep's configured rate; an unchanged
      // closer keeps the historically stamped pct (special deals survive edits).
      if(!(Array.isArray(sj.splits)&&sj.splits.length)){
        shared.closerId=closerId;
        shared.commissionPct=closerId?(sj.closerId===closerId?+sj.commissionPct||0:userRate(closerId)):0;
      }
      updateJob(sj.id,shared);
    });
    const entries=[];
    document.querySelectorAll("#job-body [data-svc]").forEach(row=>{
      entries.push({service:row.dataset.svc,on:true,price:+row.querySelector(".slot-price").value||0});
    });
    // A sibling service whose row was ✕-removed from the list is an explicit off.
    siblings.forEach(sj=>{if(!entries.some(e=>e.service===sj.service))entries.push({service:sj.service,on:false,price:0});});
    const r=applySlotServices(cid,date,time,entries); // key is the NEW date/time — jobs already moved above
    closeModal("job-overlay");render();
    toast(r.blocked.length?r.blocked.length+" done job"+(r.blocked.length===1?"":"s")+" kept — mark not-done first to remove":"Job saved",
      r.blocked.length?"err":"ok");
    return;
  }
  const data={
    customerId:cid,
    service:$("#jf-service").value||(db.settings.services[0]?db.settings.services[0].name:""),
    price:+$("#jf-price").value||0,
    date:$("#jf-date").value||today(),
    time:$("#jf-time").value||"",
    durMin:+$("#jf-dur").value||60,
    notes:($("#jf-notes").value||"").trim(),
  };
  if(!editJob)data.crewIds=[]; // crew field removed from the form; edits leave existing crewIds alone
  // A split job has no closer/commission select on the form (jobForm) — skip those fields
  // entirely so the merge in updateJob leaves j.splits (and its closerId/commissionPct) untouched.
  const isSplit=!!(curJob&&Array.isArray(curJob.splits)&&curJob.splits.length);
  if(!isSplit){
    const closerVal=$("#jf-closer").value;
    const closerId=closerVal?+closerVal:null;
    data.closerId=closerId;
    // Rate = the rep's configured rate (Team screen); an unchanged closer keeps the job's
    // historically stamped pct so one-off deals aren't silently rewritten on edit.
    data.commissionPct=closerId?((curJob&&curJob.closerId===closerId)?+curJob.commissionPct||0:userRate(closerId)):0;
  }
  if(editJob)updateJob(editJob,data);else createJob(data);
  closeModal("job-overlay");render();toast("Job saved","ok");
}
function openJob(id,preset){
  editJob=id;
  const j=id?db.jobs.find(x=>x.id===id):null;
  const c=j?custById(j.customerId):((preset&&preset.customerId)?custById(preset.customerId):null);
  const siblings=j?slotSiblings(j):[];
  const isSlot=siblings.length>1;
  $("#job-title").textContent=j?"Edit job":"New job";
  // Slot mode gets a small combined-total hint next to the customer name — subtle, not a redesign.
  $("#job-hsub").textContent=(c?c.name:"")+(isSlot?" · "+money2(siblings.reduce((s,x)=>s+(+x.price||0),0))+" · "+siblings.length+" services":"");
  $("#job-body").innerHTML=jobForm(j,preset);
  $("#job-foot").innerHTML=jobFoot(j);
  const cust=$("#jf-cust");
  if(cust)cust.onchange=()=>{
    if(cust.value!=="__new")return;
    const name=(prompt("New client name:")||"").trim();
    if(!name){cust.value=j&&j.customerId?String(j.customerId):"";return;}
    const c2={id:db.seqC++,name,phone:"",email:"",street:"",city:"Toronto",lat:null,lng:null,
      stage:"won",source:"Manual",tags:[],notes:"",log:[],createdAt:Date.now(),ownerId:1,followup:""};
    db.customers.push(c2);save();
    const opt=document.createElement("option");opt.value=c2.id;opt.textContent=c2.name;
    cust.insertBefore(opt,cust.lastElementChild);cust.value=c2.id;
    toast("Client created — "+c2.name,"ok");
  };
  const svc=$("#jf-service"); // absent in slot mode — the Services field has no single service/price pair
  if(svc)svc.onchange=()=>{const o=svc.selectedOptions[0];if(o&&o.dataset.price)$("#jf-price").value=o.dataset.price;};
  bindSvcField(); // slot mode only — no-op when #jf-svcfield isn't in the form
  $("#jf-save").onclick=saveJobBtn;
  const del=$("#jf-delete");if(del)del.onclick=()=>{
    if(!editJob)return;
    // Re-read fresh from the db rather than trusting the closed-over `siblings` — nothing else
    // should have moved the record between opening the modal and this click, but this is cheap
    // and matches the done/undone pattern below.
    const cj=db.jobs.find(x=>x.id===editJob),sibs=cj?slotSiblings(cj):[];
    if(sibs.length>1){
      if(!confirm("Delete "+sibs.length+" jobs for "+(c?c.name:"this customer")+"?"))return;
      sibs.forEach(sj=>deleteJob(sj.id));
      closeModal("job-overlay");render();toast("Jobs deleted","ok");
    }else{
      deleteJob(editJob);closeModal("job-overlay");render();toast("Job deleted","ok");
    }
  };
  const done=$("#jf-done");if(done)done.onclick=()=>{
    const cj=db.jobs.find(x=>x.id===editJob),sibs=cj?slotSiblings(cj):[];
    if(sibs.length>1)completeSlot(cj.customerId,cj.date,cj.time||""); // one combined payment question
    else completeJobFlow(editJob);
    closeModal("job-overlay");render();
    toast("Job marked done","ok");
  };
  const undone=$("#jf-undone");if(undone)undone.onclick=()=>{
    const jj=db.jobs.find(x=>x.id===editJob);
    const sibs=jj?slotSiblings(jj):[];
    if(sibs.length>1){
      if(sibs.some(x=>(+x.collected||0)>0)&&!confirm("This visit shows money collected — undoing clears that. Sure?"))return;
      sibs.forEach(sj=>{if(sj.status==="done")uncompleteJob(sj.id);});
    }else{
      if(jj&&(+jj.collected||0)>0&&!confirm("This job shows "+money(jj.collected)+" collected — undoing clears that. Sure?"))return;
      uncompleteJob(editJob);
    }
    closeModal("job-overlay");render();
    toast("Back on the schedule","ok");
  };
  const conf=$("#jf-confirm");if(conf)conf.onclick=()=>openBookingConfirm(editJob);
  openModal("job-overlay");
}

/* --- slot services (merged card, rendered inline inside the normal job modal) ---
   A merged card is display-only folding (groupSlotJobs) — the real jobs underneath still carry
   their own money. When the edited job has siblings, jobForm swaps the single Service+Price pair
   for the checkbox rows below so the owner can add/remove/reprice each service in one visit. */
/* Same visit, same customer+date+time — the full set of jobs a merged schedule card folds into
   one (see groupSlotJobs), including j itself. Cancelled jobs are never part of the visit. */
function slotSiblings(j){
  return db.jobs.filter(x=>x.customerId===j.customerId&&x.date===j.date&&(x.time||"")===(j.time||"")&&x.status!=="cancelled");
}
/* PURE data op: no DOM, no modal calls — same shape as createJob/updateJob/deleteJob, which it
   calls. entries=[{service,on,price}]. Never touches a job outside this customerId+date+time slot.
   A checked-off DONE job is never deleted (money records don't die from an unchecked box) — it's
   left alone and reported back in .blocked so the caller can toast and it stays checked next open. */
function applySlotServices(customerId,date,time,entries){
  const jobs=db.jobs.filter(j=>j.customerId===customerId&&j.date===date&&(j.time||"")===(time||"")&&j.status!=="cancelled");
  const sibling=jobs[0]; // same visit, same closer — copied onto any new job created below
  const out={created:0,updated:0,removed:0,blocked:[]};
  (entries||[]).forEach(e=>{
    const job=jobs.find(j=>j.service===e.service);
    if(e.on){
      if(job){updateJob(job.id,{price:+e.price||0});out.updated++;}
      else{
        const data={customerId,date,time,service:e.service,price:+e.price||0,durMin:60,crewIds:[]};
        if(sibling){
          if(Array.isArray(sibling.splits)&&sibling.splits.length)data.splits=JSON.parse(JSON.stringify(sibling.splits));
          else{data.closerId=sibling.closerId;data.commissionPct=sibling.commissionPct;}
        }
        createJob(data);out.created++;
      }
    }else if(job){
      if(job.status==="done")out.blocked.push(job);
      else{deleteJob(job.id);out.removed++;}
    }
  });
  return out;
}
/* One row per service the visit actually HAS (name · price · ✕) — uncommon services don't sit
   there as unchecked clutter. New ones come in through the "＋ Add service…" dropdown below. */
function svcRow(name,price){
  return '<div class="jobline svc-line" data-svc="'+esc(name)+'">'+
    '<div class="nm">'+esc(name)+'</div>'+
    '<div class="svc-price"><span class="sym">$</span>'+
      '<input class="slot-price" type="number" min="0" step="1" value="'+(+price||0)+'"></div>'+
    '<button type="button" class="btn sm svc-rm" data-rmsvc="'+esc(name)+'" title="Remove service">✕</button>'+
  '</div>';
}
/* The "Services" field jobForm renders in place of the solo Service+Price pair once the edited
   job has siblings. saveJobBtn reads present rows as on, missing sibling services as off. */
function slotServicesField(jobs){
  const rows=jobs.map(j=>svcRow(j.service,j.price)).join("");
  const have=new Set(jobs.map(j=>j.service));
  const opts=db.settings.services.filter(s=>!have.has(s.name))
    .map(s=>'<option value="'+esc(s.name)+'" data-price="'+(+s.price||0)+'">'+esc(s.name)+'</option>').join("");
  // The select always renders (maybe with no options yet) so a removed row's service can return to it.
  return '<div class="field" id="jf-svcfield"><label>Services</label>'+rows+
    '<select id="jf-addsvc" style="margin-top:6px"><option value="">＋ Add service…</option>'+opts+'</select>'+
  '</div>';
}
/* The dropdown adds a row; ✕ removes one. All DOM-side until Save reads the rows back. */
function bindSvcField(){
  const wrap=$("#jf-svcfield");if(!wrap)return;
  const sel=$("#jf-addsvc");
  if(sel)sel.onchange=()=>{
    const o=sel.selectedOptions[0];
    if(!sel.value)return;
    sel.insertAdjacentHTML("beforebegin",svcRow(sel.value,+o.dataset.price||0));
    o.remove();sel.value="";
    bindSvcField();
  };
  wrap.querySelectorAll("[data-rmsvc]").forEach(b=>b.onclick=()=>{
    const name=b.dataset.rmsvc,row=b.closest("[data-svc]");
    row.remove();
    const s=db.settings.services.find(x=>x.name===name);
    if(s&&sel)sel.insertAdjacentHTML("beforeend",'<option value="'+esc(s.name)+'" data-price="'+(+s.price||0)+'">'+esc(s.name)+'</option>');
  });
}
/* One Done for the whole visit: every scheduled job in the slot flips together, ONE collected
   question for the combined total, and each job books its own price share so per-service money
   and commissions stay exact underneath. */
function completeSlot(customerId,date,time){
  const jobs=db.jobs.filter(j=>j.customerId===customerId&&j.date===date&&(j.time||"")===(time||"")&&j.status==="scheduled");
  if(!jobs.length)return null;
  const total=jobs.reduce((s,j)=>s+(+j.price||0),0);
  const paid=total>0&&confirm("Collected "+money(total)+" for "+jobs.map(j=>j.service).join(" + ")+"?");
  jobs.forEach(j=>{j.status="done";if(!j.completedAt)j.completedAt=Date.now();j.collected=paid?(+j.price||0):0;});
  const c=custById(customerId);
  if(c){c.log=c.log||[];c.log.push({t:Date.now(),m:"Completed "+jobs.map(j=>j.service).join(" + ")+" — "+(paid?"collected "+money(total):"unpaid")});}
  save();
  if(jobs.some(j=>j.planId))ensurePlanJobs();
  return jobs;
}

   One list engine, two screens: "leads" opens on every stage, "customers" on Won only.
   STAGES is the pipeline order — ‹ › walk it one step at a time. */
const SORTS=[["new","Newest"],["name","Name A–Z"],["value","Value: high → low"]];
const LIST={leads:{filter:"all",q:"",searchOpen:false,sort:"new",page:0,size:25},
            customers:{filter:"won",q:"",searchOpen:false,sort:"new",page:0,size:25}};
let listScreen="leads";
const LS=()=>LIST[listScreen];

/* --- customer data ops (the modals call these, so the gate drives the same code path) --- */
function createCust(data){
  const c=Object.assign({id:db.seqC++,name:"",phone:"",email:"",street:"",city:"Toronto",lat:null,lng:null,
    stage:"new",source:"Manual",tags:[],notes:"",createdAt:Date.now(),ownerId:(activeUsers()[0]||db.users[0]||{}).id||1,followup:""},
    data,{log:[{t:Date.now(),m:"Lead created."}]});
  db.customers.push(c);save();return c;
}
function updateCust(id,data){const c=custById(id);if(!c)return null;Object.assign(c,data);save();return c;}
/* Pins outlive their customer — unlink instead of leaving a dangling id behind. */
function deleteCust(id){
  db.customers=db.customers.filter(c=>c.id!==id);
  db.pins.forEach(p=>{if(p.customerId===id)p.customerId=null;});
  save();
}
function setStage(id,to){
  const c=custById(id);if(!c||c.stage===to)return null;
  const t=STAGES.find(s=>s.id===to);if(!t)return null;
  c.log=c.log||[];c.log.push({t:Date.now(),m:"↔ Stage: "+stageMeta(c.stage).label+" → "+t.label});
  c.stage=to;save();return c;
}
/* ‹ › on a card: one step along STAGES, logged. Landing on Won offers the first booking. */
function custStageMove(id,d){
  const c=custById(id);if(!c)return;
  const i=STAGES.findIndex(s=>s.id===c.stage),n=i+d;
  if(i<0||n<0||n>=STAGES.length)return;
  const to=STAGES[n];
  if(!setStage(id,to.id))return;
  if(to.id==="won")toastAction(c.name+" → Won. Book their first job?","＋ Job",()=>openJob(null,{customerId:c.id}));
  else toast(c.name+" → "+to.label,"ok");
  paintLeadRows();
}

/* --- list --- */
function custMatches(c,q){q=q.toLowerCase();
  return [c.name,c.phone,c.email,c.street,c.city,c.source,(c.tags||[]).join(" "),c.notes]
    .some(v=>(v||"").toLowerCase().includes(q));}
function leadRows(){
  const st=LS();

    "new":(a,b)=>(b.createdAt||0)-(a.createdAt||0)||a.name.localeCompare(b.name),

function leadCard(c){

/* Repaint just the list + footer — the search box keeps focus while typing. */

   :'<div class="panel"><div class="panel-pad empty"><div class="big">🌱</div>'+
    '<div class="et">'+(st.q?"No one matches that search":"Nothing here yet")+'</div>'+
    '<div style="margin-top:14px"><button class="btn btn-primary" id="lead-empty-add">＋ New lead</button></div></div></div>';

    '<button class="fcir" data-lpage="-1"'+(st.page<=0?' disabled style="opacity:.3"':'')+' aria-label="Previous page">‹</button>'+
    '<button class="fcir" data-lpage="1"'+(st.page>=pages-1?' disabled style="opacity:.3"':'')+' aria-label="Next page">›</button>':"";

  const addr=[c.street,c.city].filter(Boolean).join(", ");
  // Salesman view is the basics only: contact + edit + jobs + notes. No message queue, no
  // activity feed, no deleting accounts, no reassigning whose account it is.
  const rep=isRep();
  const repOpts=userOptList(c.ownerId).map(u=>'<option value="'+u.id+'"'+(c.ownerId===u.id?" selected":"")+'>'+esc(u.name)+'</option>').join("");
  const sec=(t,n)=>'<div class="sec">'+esc(t)+(n!=null?' <span class="tag">'+n+'</span>':'')+'</div>';

function createPlan(data){
  const id=db.seqP++;
  const p=Object.assign({id,customerId:null,name:"",service:"",notes:"",perVisit:0,visitsPerYear:0,
    months:[],firstVisit:offset(7),initialPrice:0,status:"proposed",signature:"",signedAt:0,cardOnFile:false},data);
  db.plans.push(p);save();return p;
}
function updatePlan(id,data){
  const p=db.plans.find(x=>x.id===id);if(!p)return null;
  Object.assign(p,data);save();return p;
}
function cancelPlan(id){
  const p=db.plans.find(x=>x.id===id);if(!p||p.status==="cancelled")return null;
  p.status="cancelled";
  const c=custById(p.customerId);if(c){c.log=c.log||[];c.log.push({t:Date.now(),m:"Plan cancelled — "+p.name});}
  save();return p;
}
function reactivatePlan(id){
  const p=db.plans.find(x=>x.id===id);if(!p||p.status!=="cancelled")return null;
  p.status="proposed";save();return p;
}
function signPlan(id,dataURL){
  const p=db.plans.find(x=>x.id===id);if(!p)return null;
  p.signature=dataURL||SIG_STUB;p.signedAt=Date.now();p.status="active";
  const c=custById(p.customerId);if(c){c.log=c.log||[];c.log.push({t:Date.now(),m:"✍ Signed "+p.name});}
  p.cardOnFile=!!confirm("Card collected for auto-billing? (simulated locally)");
  save();ensurePlanJobs();return p;
}

/* --- month math ---
   suggestMonths: evenly spaced months across the year starting at startMonth — exact for the
   2/4/6/12 presets (divisors of 12), a rounded best-effort for any other custom count.
   planMonths: 12 tiles anchored 4 months before → 7 after the first-visit month (same window
   the job quote sheet in the old CRM used), so the first visit always lands inside the strip. */
function suggestMonths(startMonth,visits){
  visits=Math.max(1,Math.min(12,+visits||1));
  const step=12/visits,out=[];
  for(let i=0;i<visits;i++)out.push(((startMonth-1+Math.round(i*step))%12)+1);
  return [...new Set(out)].sort((a,b)=>a-b);
}
function planMonths(firstVisitISO,monthsArr){
  const fv=new Date(firstVisitISO+"T12:00:00");
  const firstKey=fv.getFullYear()+"-"+fv.getMonth();
  const s=new Date(fv.getFullYear(),fv.getMonth()-4,1,12,0,0);
  const monSet=new Set((monthsArr||[]).map(m=>+m));
  const out=[];
  for(let i=0;i<12;i++){
    out.push({m:s.getMonth(),y:s.getFullYear(),hit:monSet.has(s.getMonth()+1),
      isFirst:(s.getFullYear()+"-"+s.getMonth())===firstKey});
    s.setMonth(s.getMonth()+1);
  }
  return out;
}
/* Next booking for an active plan: same day-of-month as firstVisit (clamped to short months),
   on the earliest selected month strictly after `from`. */
function nextPlanOccurrence(p,fromISO){
  const months=(p.months||[]).slice().sort((a,b)=>a-b);
  if(!months.length)return null;
  const dom=new Date(p.firstVisit+"T12:00:00").getDate();
  const from=fromISO||today(),fy=+from.slice(0,4);
  for(let yy=fy;yy<=fy+1;yy++)
    for(const m of months){
      const last=new Date(yy,m,0).getDate();
      const iso=localISO(new Date(yy,m-1,Math.min(dom,last)));
      if(iso>from)return iso;
    }
  return null;
}
/* Auto-rebook: every active plan always has exactly one upcoming scheduled job. Idempotent —
   only books when none exists — so app load / job-complete / plan-activation can all call it. */
function ensurePlanJobs(){
  let n=0;
  const t=today();
  db.plans.filter(p=>p.status==="active").forEach(p=>{
    if(db.jobs.some(j=>j.planId===p.id&&j.status==="scheduled"))return;
    // anchor on the plan's own latest visit (so completing a future-dated one still moves
    // forward) but never behind today.
    const last=db.jobs.filter(j=>j.planId===p.id).map(j=>j.date).sort().pop();
    const anchor=last&&last>t?last:t;
    const date=nextPlanOccurrence(p,anchor);
    if(!date)return;
    db.jobs.push({id:db.seqJ++,customerId:p.customerId,service:p.service,price:+p.perVisit||0,
      date,time:"",durMin:60,crewIds:[],status:"scheduled",collected:0,payMethod:"",notes:"",
      signature:"",signedAt:0,invoiceId:null,planId:p.id,completedAt:0,createdAt:Date.now()});
    n++;
  });
  if(n)save();
  return n;
}

      '</div></div>';
  const cv=$("#sig-pad"),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;ctx.scale(dpr,dpr);
  ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";
  let down=false,drew=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();drew=true;});
  const end=()=>{down=false;};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointerleave",end);
  $("#sig-clear").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);drew=false;};
  $("#sig-save").onclick=()=>{
    if(!drew){toast("Sign first");return;}
    signPlan(id,cv.toDataURL("image/png"));
    toast("Signed ✓","ok");openPlan(id);render();

/* ============ 8. Messages & Automations ============
   NOTHING here sends anything, ever. A local HTML file has no way to text a customer. The engine
   only decides WHAT should go out and WHEN and parks a draft in the Outbox; tapping Send opens
   the phone's own Messages app pre-filled (sms:) and the draft is marked handed-off. */
function kindMeta(k){return MSG_KINDS[k]||MSG_KINDS.manual;}
function tplBody(kind){
  const id=TPL_FOR[kind];
  const t=db.settings.templates.find(x=>x.id===id)||DEFAULT_TEMPLATES.find(x=>x.id===id);
  return t?t.body:"";
}
/* Template variables — same substitution the old CRM's texting sheet used.
   {firstname} runs before {name} so the longer token is never eaten by the shorter one. */
function fillVars(text,c,extra){
  c=c||{};extra=extra||{};
  const biz=db.settings.business||{};
  return (text||"")
    .replace(/\{firstname\}/gi,firstName(c.name))
    .replace(/\{name\}/gi,c.name||"")
    .replace(/\{service\}/gi,extra.service||"")
    .replace(/\{date\}/gi,extra.date?fmtDate(extra.date,{weekday:"long",month:"long",day:"numeric"}):"")
    .replace(/\{time\}/gi,extra.time?fmtTime(extra.time):"")
    .replace(/\{business\}/gi,biz.name||"");
}
/* What service to name in a text with no job attached: their latest one, else what we sell most. */
function custService(c){
  const j=custJobs(c.id).slice().sort((a,b)=>(a.date||"")<(b.date||"")?-1:1).pop();
  return j?j.service:((db.settings.services[0]||{}).name||"");
}
function queueMsg(customerId,kind,body,why,extra){
  const m=Object.assign({id:db.seqM++,customerId,dir:"out",kind,body,why:why||"",
    t:Date.now(),dueAt:today(),status:"queued"},extra||{});
  db.messages.push(m);return m;
}
/* The rules engine. Deterministic and idempotent: every rule refuses to queue when a matching
   draft already exists, so app-open and the button can both call it as often as they like. */
function runAutomations(){
  const a=db.settings.automation||{},t=today(),now=Date.now(),day=86400000;
  const every=Math.max(1,+a.followupEveryDays||3),maxTries=Math.max(0,+a.followupMaxTries||0);
  const kindMsgs=(cid,kind)=>db.messages.filter(m=>m.customerId===cid&&m.kind===kind);
  let n=0;
  // a. Ghosted quote → follow-up. One draft at a time, a full cadence gap between tries, capped.
  db.customers.filter(c=>c.stage==="quoted").forEach(c=>{
    const tries=kindMsgs(c.id,"followup");
    if(tries.some(m=>m.status==="queued"))return;      // one is already waiting to be sent
    if(tries.length>=maxTries)return;                  // stop nagging
    const quiet=Math.max(+c.createdAt||0,...(c.log||[]).map(l=>+l.t||0),...tries.map(m=>+m.t||0));
    if(now-quiet<every*day)return;
    queueMsg(c.id,"followup",fillVars(tplBody("followup"),c,{service:custService(c)}),
      "Quoted, quiet "+Math.floor((now-quiet)/day)+"d — try "+(tries.length+1)+" of "+maxTries);
    n++;
  });
  // b. Job wrapped in the last week → ask for a review. Once per customer, ever.
  if(a.reviewAskAfterDone)db.jobs.filter(j=>j.status==="done").forEach(j=>{
    const doneAt=+j.completedAt||(j.date?new Date(j.date+"T12:00:00").getTime():0);
    if(!doneAt||now-doneAt>7*day)return;
    const c=custById(j.customerId);
    if(!c||!c.phone)return;
    if(kindMsgs(c.id,"review").length)return;
    const link=(a.reviewLink||"").trim();
    queueMsg(c.id,"review",fillVars(tplBody("review"),c,j)+(link?" "+link:""),
      "Finished "+j.service+" "+fmtDateShort(j.date)+" — never asked for a review");
    n++;
  });
  // c. Job tomorrow → reminder today. Keyed customer+kind+job date, so re-runs never double up.
  const tom=offset(1);
  db.jobs.filter(j=>j.status==="scheduled"&&j.date===tom).forEach(j=>{
    const c=custById(j.customerId);
    if(!c||!c.phone)return;
    if(db.messages.some(m=>m.customerId===c.id&&m.kind==="reminder"&&m.jobDate===j.date))return;
    queueMsg(c.id,"reminder",fillVars(tplBody("reminder"),c,j),
      "Booked tomorrow"+(j.time?" at "+fmtTime(j.time):"")+" — confirm it",{jobDate:j.date});
    n++;
  });
  if(n)save();
  return n;
}
function stampAutoRun(){db.settings.automation.lastRun=today();save();}
/* Handoff — the draft leaves the outbox because a human sent it, not because we did. */
function markHandedOff(id){
  const m=db.messages.find(x=>x.id===id);
  if(!m||m.status==="handed-off")return null;
  m.status="handed-off";m.t=Date.now();
  const c=custById(m.customerId);
  if(c){c.log=c.log||[];
    c.log.push({t:m.t,m:"💬 Texted ("+kindMeta(m.kind).label.toLowerCase()+") — "+
      (m.body.length>70?m.body.slice(0,70)+"…":m.body)});}
  save();return m;
}

function renderMessages(){
  const t=today();
  const q=queuedMessages().slice().sort((x,y)=>x.dueAt<y.dueAt?-1:x.dueAt>y.dueAt?1:x.id-y.id);
  const due=q.filter(m=>m.dueAt<=t),later=q.filter(m=>m.dueAt>t);

    '<div class="lx-bar"><div class="lx-title" style="cursor:default">Messages</div>'+
      '<button class="mpill" id="msg-run" style="margin-left:auto">⚡ Run automations</button></div>'+
    '<div class="lead-total" style="margin:0 0 14px">Queued — tap to send. Nothing goes out on its own.</div>'+
    '<div class="panel"><h2>Outbox<span class="pill">'+q.length+' queued</span></h2><div class="panel-pad">'+
      (q.length?
        (due.length?'<div class="sec" style="margin-top:0">Due now</div>'+due.map(m=>msgRow(m,false)).join(""):'')+
        (later.length?'<div class="sec"'+(due.length?'':' style="margin-top:0"')+'>Later</div>'+

        :'<div class="empty" style="padding:26px 12px"><div class="big">✓</div>'+
          '<div class="et">Outbox clear ✓</div><div class="es">Nothing is waiting to go out.</div></div>')+
    '</div></div>'+
    (off.length?'<div class="panel"><h2>Handed off<span class="pill">last '+off.length+'</span></h2>'+
      '<div class="panel-pad">'+off.map(m=>msgRow(m,true)).join("")+'</div></div>':'')+
    msgTplCard()+msgAutoCard();
  $("#msg-run").onclick=()=>{
    const n=runAutomations();stampAutoRun();render();
    toast(n?("Queued "+n+" draft"+(n===1?"":"s")+" — tap to send"):"Nothing new to queue","ok");};
  document.querySelectorAll("[data-msend]").forEach(b=>b.onclick=()=>sendMsg(+b.dataset.msend));

/* --- payroll math (always derived from app.db — never hardcoded) --- */
/* "month"/"lastmonth" key to "YYYY-MM", "year" key to "YYYY" — jobInPeriod matches on key length. */
function payPeriodKey(p){
  const t=today();
  if(p==="year")return t.slice(0,4);
  if(p==="lastmonth"){const d=new Date(t+"T12:00:00");d.setMonth(d.getMonth()-1);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  return t.slice(0,7);
}
function jobInPeriod(dateStr,key){return key.length===4?(dateStr||"").slice(0,4)===key:(dateStr||"").slice(0,7)===key;}
function payoutsSum(userId,key){return db.payouts.filter(p=>p.userId===userId&&p.period===key).reduce((s,p)=>s+(+p.amount||0),0);}
function lastPayoutT(userId,key){const l=db.payouts.filter(p=>p.userId===userId&&p.period===key);return l.length?Math.max(...l.map(p=>p.t)):0;}
/* Per active user: done jobs they're actually CREDITED on (jobCreditedTo — splits, or the single
   stamped closer). Merely riding crewIds, or owning the customer, is no longer enough — that was
   the old bug: an owner saw "3 jobs · $448 sales" for a rep who'd closed only one of them. */
function payrollRows(key){
  const rows=[];
  activeUsers().forEach(u=>{
    const jobs=db.jobs.filter(j=>j.status==="done"&&jobInPeriod(j.date,key)&&jobCreditedTo(j,u.id));
    if(!jobs.length)return;
    const sales=jobs.reduce((s,j)=>{const cr=jobCredits(j).find(c=>c.userId===u.id);return s+(cr?cr.salesShare:0);},0);
    const commission=jobs.reduce((s,j)=>{const cr=jobCredits(j).find(c=>c.userId===u.id);return s+(cr?cr.amount:0);},0);
    const paid=payoutsSum(u.id,key);
    rows.push({user:u,jobsCount:jobs.length,sales,commission,paid,owed:Math.max(0,commission-paid),jobs});
  });
  return rows;
}
function markPaid(userId,amount,key){const p={id:db.seqPay++,t:Date.now(),userId,amount,period:key};db.payouts.push(p);save();return p;}
function markPaidClick(userId){
  const key=payPeriodKey(payPeriod);
  const row=payrollRows(key).find(r=>r.user.id===userId);
  if(!row||row.owed<=0)return null;
  const p=markPaid(userId,row.owed,key);toast("Marked paid — "+money2(row.owed),"ok");return p;
}
